# JitPack installs any JDK other than its preinstalled OpenJDK 8 through SDKMAN, which has been failing
# ("INTERNET NOT REACHABLE"), so asking for 21 or 25 kills the build before Maven runs. Ask for 8 to skip
# SDKMAN and build on Temurin 25 downloaded straight from Adoptium.
jdk:
  - openjdk8
install:
  - curl -fsSL -o /tmp/jdk25.tar.gz "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse"
  - mkdir -p /tmp/jdk25 && tar -xzf /tmp/jdk25.tar.gz -C /tmp/jdk25 --strip-components=1
  # Maven installed under ~/.m2 or /tmp has failed to start on JitPack ("could not find
  # Launcher"), while a copy inside the checkout starts reliably. pom.xml excludes this
  # dir from the editorconfig check.
  - bash -c 'export JAVA_HOME=/tmp/jdk25 PATH=/tmp/jdk25/bin:$PATH MAVEN_USER_HOME="$PWD/.jitpack-maven" MVNW_VERBOSE=true && ./mvnw -B clean install -DskipTests'
