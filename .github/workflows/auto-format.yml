name: Auto Format Java

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

# Only pushes a formatting commit back to the PR branch.
permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: maven
      - name: Apply EditorConfig formatting
        run: mvn -B -ntp org.ec4j.maven:editorconfig-maven-plugin:format
      - name: Commit formatted sources
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          commit_message: "Apply EditorConfig Formatting"
          branch: ${{ github.event.pull_request.head.ref }}
